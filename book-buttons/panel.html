<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Talking Buttons</title>
<style id="panel-style">
  :root {
    --ink: #1f2328;
    --line: #2b2f36;
    --page: #eef1f4;
    --accent: #2f6fde;
    --pronoun: #f8efae;
    --verb: #d8eed3;
    --describe: #cde4f6;
    --noun: #fde0c2;
    --place: #e6def1;
    --social: #f9d3e3;
    --question: #d9c8ef;
    --negative: #f6c6c3;
    --neutral: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  button { font: inherit; color: inherit; }
  button:focus-visible { outline: 5px solid var(--accent); outline-offset: -5px; }
  [hidden] { display: none !important; }

  /* The panel. Its grid is set by arrange() from the window's shape:
     page (a whole screen), wide (a strip) or tall (a column). */
  .panel {
    display: grid;
    height: 100vh;
    height: 100dvh;
    gap: 1.1vmin;
    padding: 1.1vmin 1.1vmin calc(1.1vmin + 12px);
    position: relative;
    --nav: clamp(48px, 7vw, 240px);
  }
  .panel > * { min-width: 0; min-height: 0; }
  #strip { grid-area: strip; } #prev { grid-area: prev; } #next { grid-area: next; }
  #setname { grid-area: name; } #set { grid-area: set; } #core { grid-area: core; }

  .strip {
    display: flex;
    align-items: stretch;
    gap: 0.6vmin;
    background: #fff;
    border: 3px solid var(--line);
    border-radius: 14px;
    padding: 0.6vmin;
    height: clamp(50px, 11vh, 420px);
  }
  .wide .strip { height: clamp(40px, 19vh, 220px); }
  .tall .strip { height: auto; flex-wrap: wrap; }
  .sentence, .title {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 0.5vmin;
    overflow-x: auto;
    overflow-y: hidden;
    min-width: 0;
    scrollbar-width: none;
    padding-left: 0.4vmin;
  }
  .tall .sentence, .tall .title { flex-basis: 100%; height: clamp(40px, 7vh, 140px); }
  .sentence::-webkit-scrollbar { display: none; }
  .sentence:empty::before {
    content: "Tap the pictures to talk";
    color: #6b7480;
    font-size: clamp(13px, 2.6vmin, 64px);
    white-space: nowrap;
  }
  .title { font-weight: 700; font-size: clamp(14px, 3.2vmin, 80px); white-space: nowrap; }
  .chip {
    flex: none;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0.2vmin 0.8vmin;
    border: 2px solid var(--line);
    border-radius: 10px;
    font-weight: 700;
    font-size: clamp(10px, 1.9vmin, 48px);
    line-height: 1.05;
    max-width: 30vw;
  }
  .chip img { height: 62%; aspect-ratio: 1; object-fit: contain; }
  .chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .tools { display: flex; gap: 0.6vmin; flex: none; }
  .tall .tools { flex: 1; justify-content: flex-end; }
  .tool {
    border: 3px solid var(--line);
    border-radius: 12px;
    background: #fff;
    font-weight: 700;
    font-size: clamp(13px, 2.4vmin, 64px);
    padding: 0 1.2vmin;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6vmin;
    cursor: pointer;
    min-width: 44px;
    min-height: 40px;
  }
  .tool svg { height: clamp(20px, 3.6vmin, 90px); width: clamp(20px, 3.6vmin, 90px); flex: none; }
  .tool.say { background: var(--accent); color: #fff; border-color: #1d4fa8; }
  .tool.float { background: #1f2328; color: #fff; }
  .floating .tool.full, .floating .tool.float { display: none; }
  .pressed { transform: scale(0.95); filter: brightness(0.92); }

  .nav {
    border: 3px solid var(--line);
    border-radius: 14px;
    background: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    min-width: 44px;
    min-height: 44px;
  }
  .nav svg { width: min(70%, 90px); max-height: 50%; }
  .nav:disabled { opacity: 0.3; cursor: default; }
  .setname {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1vmin;
    font-weight: 700;
    font-size: clamp(13px, 2.4vmin, 60px);
    white-space: nowrap;
    overflow: hidden;
  }
  .setname span { overflow: hidden; text-overflow: ellipsis; }
  .setname small { font-weight: 400; color: #5d6670; }

  .set { display: grid; gap: 1vmin; align-content: stretch; }
  .set .empty { grid-column: 1 / -1; display: grid; place-items: center; color: #6b7480; font-size: clamp(13px, 2.4vmin, 48px); }
  .core {
    display: grid;
    grid-template-columns: repeat(11, minmax(0, 1fr));
    border: 3px solid var(--line);
    background: var(--line);
    gap: 3px;
    border-radius: 8px;
    overflow: hidden;
  }
  .page .core { height: clamp(70px, 18vh, 600px); }
  .wide .core { grid-template-columns: repeat(6, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); }
  .tall .core { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); }
  .wide .core::after, .tall .core::after { content: ""; background: #fff; }

  .word {
    border: 3px solid var(--line);
    border-radius: 12px;
    margin: 0;
    padding: 4% 3% 3%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2%;
    min-height: 0;
    min-width: 0;
    cursor: pointer;
    overflow: hidden;
    container-type: size;
    transition: transform 120ms ease, filter 120ms ease;
  }
  .core .word { border: 0; border-radius: 0; }
  .word img { flex: 1; width: 100%; min-height: 0; object-fit: contain; pointer-events: none; }
  .word .label {
    font-size: clamp(10px, min(15cqh, 17cqw), 90px);
    font-weight: 700;
    line-height: 1.05;
    text-align: center;
    max-width: 100%;
    overflow-wrap: anywhere;
  }
  .core .word .label { white-space: nowrap; overflow-wrap: normal; }
  .word.no-pic .label { font-size: clamp(12px, min(26cqh, 22cqw), 140px); flex: 1; display: flex; align-items: center; }
  .word.pressed { box-shadow: inset 0 0 0 5px var(--accent); }
  .pronoun { background: var(--pronoun); } .verb { background: var(--verb); } .describe { background: var(--describe); }
  .noun { background: var(--noun); } .place { background: var(--place); } .social { background: var(--social); }
  .question { background: var(--question); } .negative { background: var(--negative); } .neutral { background: var(--neutral); }

  .credit {
    position: absolute; right: 1.2vmin; bottom: 1px;
    font-size: 10px; line-height: 11px; color: #6b7480; pointer-events: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: calc(100% - 2.4vmin);
  }
  .toast {
    position: fixed; left: 50%; bottom: 22vh; transform: translateX(-50%);
    max-width: min(640px, 92vw); background: #1f2328; color: #fff; border-radius: 12px;
    padding: 12px 44px 12px 16px; font-size: clamp(14px, 2.2vmin, 32px); line-height: 1.3; z-index: 5;
    box-shadow: 0 10px 30px rgba(0,0,0,.3);
  }
  .toast button { position: absolute; right: 6px; top: 6px; border: 0; background: transparent; color: #fff; font-size: 20px; cursor: pointer; padding: 4px 8px; }
  .away { height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; font-size: clamp(16px, 2.6vmin, 40px); }
  .away h1 { margin: 0 0 12px; font-size: 1.5em; }
  .away button { font-size: 1em; padding: 12px 22px; border-radius: 12px; border: 3px solid var(--line); background: #fff; font-weight: 700; cursor: pointer; }
  .print { display: none; }

  @media print {
    @page { margin: 10mm; }
    html, body { height: auto; overflow: visible; background: #fff; }
    body > :not(.print) { display: none !important; }
    .print { display: block; }
    .print h1 { font-size: 16pt; margin: 0 0 2mm; }
    .print h2 { font-size: 11pt; margin: 5mm 0 2mm; }
    .print .note { font-size: 9pt; color: #444; margin: 0 0 3mm; }
    .print .row { display: flex; flex-wrap: wrap; break-inside: avoid; }
    .print .card {
      width: 30mm; height: 30mm; border: 0.4mm dashed #333; margin: -0.2mm 0 0 -0.2mm;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5mm;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .print .card img { width: 100%; flex: 1; min-height: 0; object-fit: contain; }
    .print .card span { font: 700 9pt "Segoe UI", Arial, sans-serif; text-align: center; }
    .print .credit-line { font-size: 8pt; color: #555; margin-top: 5mm; }
  }
</style>
</head>
<body>
<div class="panel page" id="panel">
  <section class="strip" id="strip" aria-label="Sentence">
    <div class="sentence" id="sentence" aria-live="polite"></div>
    <div class="title" id="title" hidden></div>
    <div class="tools">
      <button type="button" class="tool say" id="say" aria-label="Say the sentence">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 4V5L7 9H3Zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4Zm-2.5-8.7v2.1a7 7 0 0 1 0 13.2v2.1a9 9 0 0 0 0-17.4Z"/></svg>
        Say it
      </button>
      <button type="button" class="tool" id="back" aria-label="Remove the last word">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" d="M21 5H9l-6 7 6 7h12V5Zm-9 4 6 6m0-6-6 6"/></svg>
      </button>
      <button type="button" class="tool" id="clear" aria-label="Clear the sentence">Clear</button>
      <button type="button" class="tool float" id="float" aria-label="Float the buttons over the activity" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M3 5h18v14H3zM12 11h7v6h-7z"/><path fill="currentColor" d="M12 11h7v6h-7z"/></svg>
        Float
      </button>
      <button type="button" class="tool full" id="full" aria-label="Full screen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </section>
  <button type="button" class="nav" id="prev" aria-label="Previous set of buttons">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M15 4 7 12l8 8"/></svg>
  </button>
  <div class="setname" id="setname" aria-live="polite"><span id="setname-text"></span><small id="setcount"></small></div>
  <section class="set" id="set" aria-label="Buttons for this page"></section>
  <button type="button" class="nav" id="next" aria-label="Next set of buttons">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="m9 4 8 8-8 8"/></svg>
  </button>
  <nav class="core" id="core" aria-label="Core words"></nav>
  <div class="credit" id="credit" hidden></div>
</div>
<section class="away" id="away" hidden>
  <div>
    <h1>The buttons are floating</h1>
    <p>They stay on top of the activity in their own small window. Drag its edges to make a strip or a column.</p>
    <p><button type="button" id="return">Bring the buttons back here</button></p>
  </div>
</section>
<div class="toast" id="toast" role="status" hidden><span id="toast-text"></span><button type="button" id="toast-close" aria-label="Close">✕</button></div>
<section class="print" id="print" aria-hidden="true"></section>

<script type="application/json" id="calm-buttons">null</script>
<script type="application/json" id="panel-assets">null</script>
<script>
'use strict';
/* Talking buttons for a classroom activity, made with the Calming Corner Book Buttons.
   The activity itself (Google Slides, PowerPoint, a PDF) keeps running in its own
   app; these buttons float over it in a picture-in-picture window, or sit beside
   it on this page. Everything is inside this one file: no network, no tracking. */
const read = (id) => { try { return JSON.parse(document.getElementById(id).textContent); } catch (_) { return null; } };
const DATA = read('calm-buttons');
const ASSETS = read('panel-assets') || {};
const CORE = [
  ['i', 'I', 'pronoun'], ['want', 'want', 'verb'], ['put', 'put', 'verb'], ['on', 'on', 'place'], ['off', 'off', 'place'],
  ['more', 'more', 'describe'], ['finished', 'finished', 'describe'], ['help', 'help', 'verb'], ['stop', 'Stop', 'verb'],
  ['go', 'Go', 'verb'], ['no', 'no/not', 'neutral'],
];
const KINDS = ['pronoun', 'verb', 'describe', 'noun', 'place', 'social', 'question', 'negative', 'neutral'];
const el = {};
for (const id of ['panel', 'strip', 'sentence', 'title', 'say', 'back', 'clear', 'float', 'full', 'prev', 'next', 'setname', 'setname-text', 'setcount', 'set', 'core', 'credit', 'away', 'return', 'toast', 'toast-text', 'toast-close', 'print']) {
  el[id] = document.getElementById(id);
}

/* ---------- sound: the button's own clip, else the device's voice ---------- */
let ctx = null;
const buffers = new Map();
let sources = [];
let element = null;
let finish = null;
let token = 0;

/* A clip is a data: URL, or bare base64 with an optional clipType. Without one,
   the type comes from the audio's first bytes (the extension records WebM). */
function sniff(b64) {
  let head = '';
  try { head = atob(b64.slice(0, 24)); } catch (_) { return 'audio/mpeg'; }
  const at = (i) => head.charCodeAt(i);
  if (at(0) === 0x1a && at(1) === 0x45 && at(2) === 0xdf && at(3) === 0xa3) return 'audio/webm';
  if (head.startsWith('OggS')) return 'audio/ogg';
  if (head.startsWith('RIFF')) return 'audio/wav';
  if (head.slice(4, 8) === 'ftyp') return 'audio/mp4';
  return 'audio/mpeg';
}
function clipURL(item) {
  if (!item || typeof item.clip !== 'string' || !item.clip) return null;
  if (/^data:/.test(item.clip)) return item.clip;
  const type = /^audio\/[a-z0-9.+-]+(;[^,]*)?$/i.test(item.clipType || '') ? item.clipType : sniff(item.clip);
  return 'data:' + type + ';base64,' + item.clip;
}
function everything() {
  const list = (DATA.sets || []).flatMap((s) => s.buttons || []);
  return list.concat(coreItems());
}
function decode(item) {
  const url = clipURL(item);
  if (!url || buffers.has(url) || !ctx) return;
  buffers.set(url, null);
  fetch(url).then((r) => r.arrayBuffer()).then((b) => ctx.decodeAudioData(b)).then((buf) => { buffers.set(url, buf); }, () => { buffers.delete(url); });
}
function wake() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC || !DATA) return;
  if (!ctx) {
    try { ctx = new AC(); } catch (_) { return; }
    everything().forEach(decode);
  }
  if (ctx.state === 'suspended') ctx.resume().catch(() => {});
}
function stopAll() {
  token++;
  sources.forEach((s) => { try { s.stop(); } catch (_) {} });
  sources = [];
  if (element) { element.pause(); element = null; }
  try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (_) {}
  if (finish) { const f = finish; finish = null; f(); }
}
function playOne(item) {
  return new Promise((resolve) => {
    let done = false;
    const end = () => { if (!done) { done = true; finish = null; resolve(); } };
    finish = end;
    const url = clipURL(item);
    if (url) {
      element = new Audio(url);
      element.onended = end;
      element.onerror = end;
      element.play().catch(end);
      return;
    }
    const text = (item.say || item.label || '').trim();
    if (!text || !window.speechSynthesis || !window.SpeechSynthesisUtterance) { end(); return; }
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.9;
      u.onend = end;
      u.onerror = end;
      window.speechSynthesis.speak(u);
      setTimeout(end, 1500 + text.length * 160);
    } catch (_) { end(); }
  });
}
/* When every clip is decoded, the whole sentence is scheduled on the audio clock,
   so it plays smoothly even while this tab is in the background behind the activity. */
async function speak(items) {
  stopAll();
  const mine = token;
  const bufs = items.map((i) => (ctx && ctx.state === 'running' ? buffers.get(clipURL(i)) : null));
  if (items.length && bufs.every(Boolean)) {
    let at = ctx.currentTime + 0.02;
    for (const buf of bufs) {
      const src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(ctx.destination);
      src.start(at);
      sources.push(src);
      at += buf.duration + 0.12;
    }
    return;
  }
  for (const item of items) {
    if (mine !== token) return;
    await playOne(item);
    if (mine !== token) return;
    await new Promise((r) => setTimeout(r, 120));
  }
}

/* ---------- buttons ---------- */
const kind = (k) => (KINDS.includes(k) ? k : 'neutral');
function img(src) {
  const i = el.panel.ownerDocument.createElement('img');
  i.alt = '';
  i.draggable = false;
  i.src = src;
  return i;
}
function flash(b) {
  b.classList.add('pressed');
  clearTimeout(b._t);
  b._t = setTimeout(() => b.classList.remove('pressed'), 240);
}
/* Act on the first touch, and ignore the extra contacts a board reports for one press. */
function onPress(b, fn) {
  let last = -Infinity;
  b.addEventListener('pointerdown', (e) => {
    if (e.button > 0) return;
    const now = performance.now();
    if (now - last < 350) return;
    last = now;
    wake();
    flash(b);
    fn(e);
  });
  b.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); wake(); flash(b); fn(e); }
  });
}

/* Opening a window or going full screen needs a user activation. A touch
   pointerdown is not one (only the click after it is), so these run on click. */
function onClick(b, fn) {
  b.addEventListener('click', (e) => { wake(); flash(b); fn(e); });
}

const words = [];
function renderSentence() {
  el.sentence.textContent = '';
  for (const w of words) {
    const chip = el.panel.ownerDocument.createElement('span');
    chip.className = 'chip ' + kind(w.category);
    if (w.picture) chip.appendChild(img(w.picture));
    const s = el.panel.ownerDocument.createElement('span');
    s.textContent = w.label || w.say;
    chip.appendChild(s);
    el.sentence.appendChild(chip);
  }
  el.sentence.scrollLeft = el.sentence.scrollWidth;
}
function choose(item) {
  if (DATA.sentence !== false) { words.push(item); renderSentence(); }
  speak([item]);
}
function wordButton(item) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'word ' + kind(item.category);
  b.setAttribute('aria-label', item.label || item.say || 'word');
  if (item.picture) b.appendChild(img(item.picture)); else b.classList.add('no-pic');
  const label = document.createElement('span');
  label.className = 'label';
  label.textContent = item.label || '';
  b.appendChild(label);
  onPress(b, () => choose(item));
  return b;
}
function coreItems() {
  if (DATA.core === false) return [];
  const pics = ASSETS.core || {};
  return CORE.map(([slug, label, category]) => ({
    id: 'core-' + slug, label, say: label === 'no/not' ? 'no' : label, category,
    picture: pics[slug] ? pics[slug].picture : null, clip: pics[slug] ? pics[slug].clip : null,
  }));
}

/* ---------- sets: one per page of the activity, or one for the whole book ---------- */
let index = 0;
let mode = 'page';
const PER_VIEW = 12;
function sets() { return DATA.sets && DATA.sets.length ? DATA.sets : [{ name: '', buttons: [] }]; }
/* What the arrows step through: each set, and a long set in pages of 12 buttons. */
let viewList = null;
function views() {
  if (viewList) return viewList;
  viewList = [];
  sets().forEach((set, s) => {
    const all = set.buttons || [];
    const parts = Math.max(1, Math.ceil(all.length / PER_VIEW));
    for (let p = 0; p < parts; p++) {
      viewList.push({ set, s, part: p + 1, parts, buttons: all.slice(p * PER_VIEW, (p + 1) * PER_VIEW) });
    }
  });
  return viewList;
}
function showSet(i) {
  const list = views();
  index = Math.max(0, Math.min(list.length - 1, i));
  const view = list[index];
  const name = view.set.name || `Set ${view.s + 1}`;
  el['setname-text'].textContent = view.parts > 1 ? `${name} (${view.part} of ${view.parts})` : name;
  el.setcount.textContent = list.length > 1 ? `${index + 1} / ${list.length}` : '';
  el.prev.disabled = index === 0;
  el.next.disabled = index === list.length - 1;
  el.set.textContent = '';
  const buttons = view.buttons;
  if (!buttons.length) {
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = 'No buttons for this page.';
    el.set.appendChild(p);
  }
  for (const item of buttons) el.set.appendChild(wordButton(item));
  arrange();
}

/* Lays the panel out for the shape of the window it is in. */
function arrange() {
  const win = el.panel.ownerDocument.defaultView;
  if (!win) return;
  const W = win.innerWidth || 1, H = win.innerHeight || 1;
  mode = W / H >= 2.1 ? 'wide' : W / H <= 0.8 ? 'tall' : 'page';
  el.panel.classList.remove('page', 'wide', 'tall');
  el.panel.classList.add(mode);
  const many = views().length > 1;
  const core = DATA.core !== false;
  el.prev.hidden = el.next.hidden = el.setname.hidden = !many;
  const n = Math.max(1, views()[index].buttons.length);
  const s = el.panel.style;
  if (mode === 'wide') {
    const cols = [many && 'var(--nav)', 'minmax(0, 1fr)', many && 'var(--nav)', core && 'minmax(0, 1.3fr)'].filter(Boolean);
    const row = (mid) => [many && 'prev', mid, many && 'next', core && 'core'].filter(Boolean).join(' ');
    s.gridTemplateColumns = cols.join(' ');
    s.gridTemplateRows = many ? 'auto auto minmax(0, 1fr)' : 'auto minmax(0, 1fr)';
    s.gridTemplateAreas = [`"${Array(cols.length).fill('strip').join(' ')}"`, many && `"${row('name')}"`, `"${row('set')}"`].filter(Boolean).join(' ');
    el.set.style.gridTemplateColumns = `repeat(${Math.min(6, Math.max(2, Math.ceil(n / (n > 6 ? 2 : 1))))}, minmax(0, 1fr))`;
    el.set.style.gridTemplateRows = `repeat(${n > 6 ? 2 : 1}, minmax(0, 1fr))`;
  } else if (mode === 'tall') {
    s.gridTemplateColumns = 'var(--nav) minmax(0, 1fr) var(--nav)';
    s.gridTemplateRows = ['auto', many && 'auto', 'minmax(0, 1fr)', core && 'minmax(0, 1.15fr)'].filter(Boolean).join(' ');
    s.gridTemplateAreas = ['"strip strip strip"', many && '"prev name next"', '"set set set"', core && '"core core core"'].filter(Boolean).join(' ');
    el.set.style.gridTemplateColumns = 'repeat(2, minmax(0, 1fr))';
    el.set.style.gridTemplateRows = `repeat(${Math.ceil(n / 2)}, minmax(0, 1fr))`;
  } else {
    const cols = many ? 'var(--nav) minmax(0, 1fr) var(--nav)' : 'minmax(0, 1fr)';
    const span = (a) => (many ? `"${a} ${a} ${a}"` : `"${a}"`);
    s.gridTemplateColumns = cols;
    s.gridTemplateRows = ['auto', many && 'auto', 'minmax(0, 1fr)', core && 'auto'].filter(Boolean).join(' ');
    s.gridTemplateAreas = [span('strip'), many && '"prev name next"', many ? '"prev set next"' : '"set"', core && span('core')].filter(Boolean).join(' ');
    const cols2 = Math.min(6, Math.max(3, n > 6 ? Math.ceil(n / 2) : n));
    el.set.style.gridTemplateColumns = `repeat(${cols2}, minmax(0, 1fr))`;
    el.set.style.gridTemplateRows = `repeat(${Math.ceil(n / cols2)}, minmax(0, 1fr))`;
  }
}

/* ---------- floating over the activity (Document Picture-in-Picture) ---------- */
const canFloat = 'documentPictureInPicture' in window && window.self === window.top;
let pip = null;
const SIZE_KEY = 'calm-buttons:float-size';
function savedSize() {
  try {
    const s = JSON.parse(localStorage.getItem(SIZE_KEY));
    if (s && s.width > 100 && s.height > 80) return s;
  } catch (_) { /* no storage */ }
  return { width: Math.min(1200, screen.availWidth || 1200), height: 300 };
}
async function float() {
  if (!canFloat || pip) return;
  wake();
  try {
    pip = await window.documentPictureInPicture.requestWindow(savedSize());
  } catch (_) {
    toast('The buttons could not float. Use them on this page instead.');
    return;
  }
  const style = pip.document.createElement('style');
  style.textContent = document.getElementById('panel-style').textContent;
  pip.document.head.appendChild(style);
  pip.document.title = DATA.title || 'Talking buttons';
  pip.document.addEventListener('contextmenu', (e) => e.preventDefault());
  pip.document.addEventListener('keydown', keys);
  el.panel.classList.add('floating');
  pip.document.body.appendChild(el.panel);
  el.away.hidden = false;
  el.toast.hidden = true;
  pip.addEventListener('resize', arrange);
  pip.addEventListener('pagehide', () => {
    try { localStorage.setItem(SIZE_KEY, JSON.stringify({ width: pip.innerWidth, height: pip.innerHeight })); } catch (_) { /* no storage */ }
    pip = null;
    el.panel.classList.remove('floating');
    document.body.insertBefore(el.panel, document.body.firstChild);
    el.away.hidden = true;
    arrange();
  });
  arrange();
}

function keys(e) {
  if (e.key === 'ArrowRight' || e.key === 'PageDown') showSet(index + 1);
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') showSet(index - 1);
}

let toastTimer = 0;
function toast(text) {
  el['toast-text'].textContent = text;
  el.toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.toast.hidden = true; }, 12000);
}

/* ---------- print: the buttons as cut-out strips ---------- */
function buildPrint() {
  const out = el.print;
  const h = document.createElement('h1');
  h.textContent = DATA.title || 'Talking buttons';
  const note = document.createElement('p');
  note.className = 'note';
  note.textContent = 'Cut out each strip, or each card along the dashed lines.';
  out.append(h, note);
  const row = (title, items) => {
    if (!items.length) return;
    const h2 = document.createElement('h2');
    h2.textContent = title;
    const r = document.createElement('div');
    r.className = 'row';
    for (const item of items) {
      const c = document.createElement('div');
      c.className = 'card ' + kind(item.category);
      if (item.picture) c.appendChild(img(item.picture));
      const s = document.createElement('span');
      s.textContent = item.label || item.say || '';
      c.appendChild(s);
      r.appendChild(c);
    }
    out.append(h2, r);
  };
  sets().forEach((set, i) => row(set.name || `Set ${i + 1}`, set.buttons || []));
  row('Core words', coreItems());
  if (ASSETS.credits) {
    const c = document.createElement('p');
    c.className = 'credit-line';
    c.textContent = ASSETS.credits;
    out.appendChild(c);
  }
}

/* ---------- start ---------- */
function start() {
  if (!DATA || DATA.format !== 'calm-buttons' || !Array.isArray(DATA.sets)) {
    document.body.innerHTML = '<p style="padding:24px;font-size:20px">These buttons have no data yet. Open the file in Book Buttons.</p>';
    return;
  }
  document.title = DATA.title || 'Talking buttons';
  const sentenceOn = DATA.sentence !== false;
  el.sentence.hidden = !sentenceOn;
  el.say.hidden = el.back.hidden = el.clear.hidden = !sentenceOn;
  el.title.hidden = sentenceOn;
  el.title.textContent = DATA.title || '';
  el.core.hidden = DATA.core === false;
  for (const item of coreItems()) el.core.appendChild(wordButton(item));
  if (ASSETS.credits) { el.credit.hidden = false; el.credit.textContent = ASSETS.credits; }
  el.float.hidden = !canFloat;
  onPress(el.say, () => speak(words.slice()));
  onPress(el.back, () => { words.pop(); renderSentence(); });
  onPress(el.clear, () => { words.length = 0; renderSentence(); stopAll(); });
  onPress(el.prev, () => showSet(index - 1));
  onPress(el.next, () => showSet(index + 1));
  onClick(el.float, float);
  onClick(el.full, () => {
    const d = document;
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else { const r = d.documentElement; const f = r.requestFullscreen || r.webkitRequestFullscreen; if (f) f.call(r); }
  });
  el.return.addEventListener('click', () => { if (pip) pip.close(); });
  el['toast-close'].addEventListener('click', () => { el.toast.hidden = true; });
  document.addEventListener('keydown', keys);
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  window.addEventListener('resize', arrange);
  /* Book Buttons' preview asks for a set. */
  window.addEventListener('message', (e) => {
    const m = e.data || {};
    if (m.type === 'calm-buttons:set' && Number.isInteger(m.index)) showSet(Math.max(0, views().findIndex((v) => v.s === m.index)));
  });
  renderSentence();
  buildPrint();
  showSet(0);
  if (window.self === window.top) {
    toast(canFloat
      ? 'Open the activity, then tap Float: these buttons stay on top of it in their own window.'
      : 'To use these buttons beside the activity on an iPad, open this file in Safari and use Split View (or Slide Over) with the activity.');
  }
  document.documentElement.dataset.ready = 'true';
}
start();
</script>
